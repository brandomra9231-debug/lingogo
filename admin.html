<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoGO - Panel de Control Privado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #2a6fb0;
            --dark-blue: #1b4b7a;
            --light-bg: #f4f6f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header i {
            font-size: 40px;
            color: var(--primary-blue);
            margin-bottom: 10px;
        }

        .header h2 {
            color: var(--dark-blue);
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-blue);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--dark-blue);
        }

        .btn-view-site {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
        }

        .btn-view-site:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <!-- VISTA 1: LOGIN -->
        <div id="login-section">
            <div class="header">
                <i class="fas fa-user-shield"></i>
                <h2>Acceso Administrador</h2>
            </div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="admin-email" value="admin@lingogo.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="admin-password" value="admin123">
            </div>
            <button class="btn-submit" id="btn-login">Ingresar al Panel</button>
            <a href="index.html" class="btn-view-site">← Volver a la página principal</a>
        </div>

        <!-- VISTA 2: FORMULARIO PARA SUBIR CLASES -->
        <div id="upload-section" style="display: none;">
            <div class="header">
                <i class="fas fa-folder-plus"></i>
                <h2>Publicar Nuevo Tema / Clase</h2>
            </div>
            <form id="add-course-form">
                <div class="form-group">
                    <label>Carpeta / Nivel</label>
                    <select id="course-folder-input" required>
                        <option value="Inglés Básico (A1-A2)">Inglés Básico (A1-A2)</option>
                        <option value="Inglés Intermedio (B1-B2)">Inglés Intermedio (B1-B2)</option>
                        <option value="Inglés Avanzado (C1)">Inglés Avanzado (C1)</option>
                        <option value="Inglés de Negocios">Inglés de Negocios</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Título del Tema</label>
                    <input type="text" id="course-title-input" placeholder="Ej: Grammar & Conversation Level 1" required>
                </div>
                <div class="form-group">
                    <label>URL de Imagen de Portada (Banner)</label>
                    <input type="url" id="course-img-input" placeholder="https://images.unsplash.com/..." required>
                </div>
                <button type="submit" class="btn-submit" style="background-color: #28a745;">
                    <i class="fas fa-upload"></i> Publicar Clase en Web
                </button>
            </form>
            <a href="index.html" class="btn-view-site" style="margin-top: 20px;">Ver la web oficial →</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAMRnwxrVLT1lraQ_DHI3SGIssbd-c8CjU",
            authDomain: "lingogo-academy.firebaseapp.com",
            projectId: "lingogo-academy",
            storageBucket: "lingogo-academy.firebasestorage.app",
            messagingSenderId: "768329774264",
            appId: "1:768329774264:web:51f1281d9bf8f19108304d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loginSection = document.getElementById('login-section');
        const uploadSection = document.getElementById('upload-section');
        const btnLogin = document.getElementById('btn-login');
        const addCourseForm = document.getElementById('add-course-form');

        btnLogin.addEventListener('click', () => {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-password').value;

            if (email === "admin@lingogo.com" && pass === "admin123") {
                loginSection.style.display = "none";
                uploadSection.style.display = "block";
            } else {
                alert("Usuario o contraseña incorrectos");
            }
        });

        addCourseForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const folder = document.getElementById('course-folder-input').value;
            const title = document.getElementById('course-title-input').value;
            const bg = document.getElementById('course-img-input').value;

            try {
                await addDoc(collection(db, "courses"), {
                    folder,
                    title,
                    bg,
                    votes: Math.floor(Math.random() * 30) + 10,
                    visits: Math.floor(Math.random() * 300) + 50,
                    rating: 5,
                    createdAt: new Date()
                });

                alert("¡Clase publicada con éxito! Aparecerá de inmediato en la página principal.");
                addCourseForm.reset();
            } catch (error) {
                alert("Error al guardar: " + error.message);
            }
        });
    </script>
</body>
</html>
